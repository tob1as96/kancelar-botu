<style>
:root{--g-work:#34d058;--g-done:#17a34a;--g-wait:#f5b301;--g-err:#ef4444;--g-rest:#94a3b8;--ink:#eef1f6;--mut:#a3adbd}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(1200px 800px at 50% 30%,#f9fbfe 0%,#e8edf4 60%,#d9e0ea 100%)}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glass{position:fixed;background:rgba(20,25,34,.62);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 8px 32px rgba(10,14,22,.28);color:var(--ink)}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:#fff;color:#1c2330;border:2px solid var(--g-rest);border-radius:12px;padding:3px 8px 4px;max-width:150px;box-shadow:0 3px 10px rgba(30,40,60,.22);font-size:11px;line-height:1.25;will-change:transform;display:none}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:inherit;border-bottom:0}
.bub b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;color:#4b5565}
.bub.sel{z-index:5;max-width:230px}.bub.sel span{-webkit-line-clamp:5}
.bub.rest{opacity:.62}
.bub.need{animation:bp 1.2s ease-in-out infinite}
@keyframes bp{50%{box-shadow:0 0 0 6px rgba(245,179,1,.4),0 3px 10px rgba(30,40,60,.22)}}
.bub i{position:absolute;right:-6px;top:-8px;background:#6d5bd0;color:#fff;font:700 9px/1 system-ui;padding:3px 5px;border-radius:99px;font-style:normal;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#pill{top:14px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:99px;display:flex;gap:10px;align-items:center;white-space:nowrap;font-weight:600}
#pill .sep{color:#69758a}
#pill .w{color:#6ee58a}#pill .n{color:#ffd24d}#pill .r{color:#b4bdcb}#pill .d{color:#7fd9a1}
#conn{font-size:11px;font-weight:500;color:var(--mut)}
#conn::before,#dotm::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g-rest);margin-right:6px}
#conn.ok::before,#dotm.ok::before{background:var(--g-work);box-shadow:0 0 8px var(--g-work)}
#conn.bad::before,#dotm.bad::before{background:var(--g-err)}
#left{left:14px;top:14px;width:268px;max-height:calc(100% - 28px - 30vh - 12px);overflow:auto;padding:12px}
#left h1{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h4{margin:12px 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.fl{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:5px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.fl:hover{background:rgba(255,255,255,.12)}
.fl.on{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.35)}
.fl .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--g-rest)}
.fl .t{flex:1;font-weight:650}
.fl small{color:var(--mut)}.fl .warn{color:#ffd24d;font-weight:700}
.acc{margin-bottom:4px;border-radius:10px;background:rgba(255,255,255,.05)}
.acc>button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;font-weight:650;padding:8px 10px;cursor:pointer;text-align:left}
.acc>button .c{margin-left:auto;background:rgba(255,255,255,.14);border-radius:99px;padding:0 8px;font-size:11px}
.acc>button::before{content:"▸";color:var(--mut);transition:transform .15s}
.acc.open>button::before{transform:rotate(90deg)}
.acc .body{display:none;padding:0 6px 6px}.acc.open .body{display:block}
.mini{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer}
.mini:hover{background:rgba(255,255,255,.1)}
.mini .sw{width:9px;height:9px;border-radius:50%;flex:none}
.mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.mini small{color:var(--mut);flex:none}
.none{color:var(--mut);padding:4px 6px;font-size:12px}
#feedbox{left:14px;bottom:14px;width:268px;height:30vh;display:flex;flex-direction:column;padding:10px 12px}
#feedbox h4{margin:0 0 6px}
#feed3{overflow:auto;flex:1}
.ev{display:flex;gap:7px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;font-size:12px}
.ev:last-child{border:0}
.ev time{color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.ev .sw{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.ev div{word-break:break-word;min-width:0}.ev b{font-weight:650}
#right{right:14px;top:14px;width:292px;max-height:calc(100% - 28px - 76px - 12px);overflow:hidden;display:flex;flex-direction:column}
body.hasdetail #right{max-height:calc(100% - 28px - 345px - 24px)}
#rhead{padding:11px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--hc,#64748b),rgba(255,255,255,0));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#rhead small{font-weight:500;opacity:.92}
#floortabs{display:none;gap:6px;overflow-x:auto;padding:8px 10px 0}
#floortabs button{flex:none;background:rgba(255,255,255,.1);border:1px solid transparent;color:inherit;border-radius:99px;padding:4px 12px;font:inherit;cursor:pointer}
#floortabs button.on{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4)}
#rlist{overflow:auto;padding:8px;flex:1}
.rb{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.rb:hover{background:rgba(255,255,255,.09)}.rb.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;color:#fff;position:relative}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--sc,#94a3b8);border:2px solid #232a37}
.rb .tx{min-width:0;flex:1}.rb .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb .ln{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;background:#6d5bd0;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:1px}
#detail{right:14px;bottom:76px;width:292px;padding:14px;max-height:calc(100% - 100px)}
#detail[hidden]{display:none}
#detail .hd{display:flex;gap:10px;align-items:center}
#detail .x{margin-left:auto;background:rgba(255,255,255,.1);border:0;color:inherit;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px}
#detail h3{margin:0;font-size:15px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#10151d;background:var(--sc,#94a3b8)}
.kv{margin-top:9px;color:var(--mut)}.kv b{color:var(--ink);font-weight:600}
.task{margin-top:6px;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:10px;word-break:break-word;max-height:90px;overflow:auto}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.met div{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 8px;text-align:center}
.met b{display:block;font-size:16px}.met small{color:var(--mut);font-size:10px}
.btn{display:block;width:100%;text-align:center;margin-top:8px;padding:8px 10px;border-radius:11px;background:#3b82f6;color:#fff;text-decoration:none;font:inherit;font-weight:650;border:0;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.alt{background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.55;cursor:default}
.btn.rep{background:#6d5bd0}
.wait{margin-top:8px;text-align:center;color:#ffd24d;font-weight:600}
.wait::before{content:"";display:inline-block;width:9px;height:9px;border:2px solid #ffd24d;border-right-color:transparent;border-radius:50%;margin-right:7px;animation:sp 1s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
#ctl{right:14px;bottom:14px;display:flex;gap:4px;padding:5px;border-radius:14px}
#ctl button{width:38px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:inherit;font-size:18px;cursor:pointer}
#ctl button:hover{background:rgba(255,255,255,.2)}
#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#5f6b7d;font-size:11px;pointer-events:none;white-space:nowrap}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#5f6b7d;font-size:15px;pointer-events:none}
#dotm{display:none;position:fixed;left:12px;top:10px;color:#566178;font-size:11px}
#modal{position:fixed;inset:0;background:rgba(10,14,22,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{position:relative;width:min(820px,100%);max-height:88vh;overflow:auto;padding:22px 26px;background:rgba(20,25,34,.88)}
#modal .box.glass{position:relative}
#modal .close{position:sticky;float:right;top:0;background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px}
.md h1,.md h2,.md h3,.md h4{margin:16px 0 6px;line-height:1.25;color:#fff;letter-spacing:0;text-transform:none;font-size:inherit}
.md h1{font-size:21px}.md h2{font-size:17px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:3px}.md h3{font-size:14.5px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}
.md code{background:rgba(255,255,255,.12);padding:1px 5px;border-radius:5px;font:12px ui-monospace,Consolas,monospace}
.md pre{background:rgba(0,0,0,.35);padding:10px 12px;border-radius:10px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px}.md td,.md th{border:1px solid rgba(255,255,255,.18);padding:4px 9px}.md th{background:rgba(255,255,255,.08)}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid #6d5bd0;color:#c4ccda}
.md hr{border:0;border-top:1px solid rgba(255,255,255,.18);margin:12px 0}
.mdmeta{color:var(--mut);font-size:12px;margin-bottom:8px}
@media(max-width:699px){
 #left,#feedbox,#pill,#hint{display:none}
 #dotm{display:block}
 #right{left:8px;right:8px;bottom:8px;top:auto;width:auto;max-height:40vh}
 body.hasdetail #right{max-height:40vh}
 #floortabs{display:flex}
 #rlist{display:flex;flex-direction:row;gap:8px;overflow-x:auto;overflow-y:hidden}
 .rb{min-width:210px;margin:0;background:rgba(255,255,255,.06)}
 #detail{left:8px;right:8px;top:8px;bottom:auto;width:auto;max-height:46vh;overflow:auto}
 #ctl{right:8px;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column}
 #ctl button{width:34px;height:34px}
 #modal .box{padding:16px}
 .bub{max-width:90px;padding:3px 6px}.bub span{display:none}.bub.sel span{display:-webkit-box}.bub i{display:none}
}
/* ---- 2D záloha ---- */
#fb{display:none;--bg:#f4f5f7;--card:#fff;--fg:#1c2128;--mut2:#6b7380;--bd:#d8dce2;--start:#2f81f7;--done:#2da44e;--stuck:#d97706;--need:#e5484d;--idle:#8b94a3;background:var(--bg);color:var(--fg);min-height:100%}
@media(prefers-color-scheme:dark){#fb{--bg:#0f1318;--card:#171c23;--fg:#e6e9ee;--mut2:#8a93a1;--bd:#2a313b}}
body.fb{overflow:auto;background:#f4f5f7}body.fb #app{display:none}body.fb #fb{display:block}
#fb header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
#fb header h1{font-size:18px;margin:0;flex:1}
#fb #conn2{font-size:12px;color:var(--mut2)}
#fb #banner{display:none;margin:12px 18px 0;padding:10px 14px;border-radius:8px;background:var(--need);color:#fff;font-weight:600}
#fb main{display:grid;grid-template-columns:1fr 330px;gap:18px;padding:18px}
@media(max-width:900px){#fb main{grid-template-columns:1fr}}
#fb .floor{margin-bottom:22px}
#fb .floor h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin:0 0 8px;border-bottom:1px dashed var(--bd);padding-bottom:4px}
#fb .desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#fb .desk{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--idle);border-radius:10px;padding:10px 12px}
#fb .desk.start{border-left-color:var(--start)}#fb .desk.done{border-left-color:var(--done)}#fb .desk.stuck{border-left-color:var(--stuck)}#fb .desk.need{border-left-color:var(--need)}
#fb .top{display:flex;gap:10px;align-items:center}
#fb .av2{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:none}
#fb .nm{font-weight:650}#fb .role{color:var(--mut2);font-size:12px}
#fb .st{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff;background:var(--idle);margin-top:6px}
#fb .st.start{background:var(--start)}#fb .st.done{background:var(--done)}#fb .st.stuck{background:var(--stuck)}#fb .st.need{background:var(--need)}
#fb .last{margin-top:6px;word-break:break-word}#fb .when{color:var(--mut2);font-size:12px}
#fb .meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mut2)}
#fb a{color:var(--start)}
#fb aside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
#fb aside h2{font-size:13px;margin:0 0 8px;color:var(--mut2);text-transform:uppercase}
#fb .ev2{padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px;word-break:break-word}
#fb .empty{color:var(--mut2)}
</style>
</head>
<body>
<div id="app">
<canvas id="gl" tabindex="0"></canvas>
<div id="bubbles"></div>
<div id="dotm">živě</div>
<div id="pill" class="glass"></div>
<aside id="left" class="glass"><h1><span>🏢 Kancelář botů</span><span id="conn">připojuji…</span></h1>
<h4>Patra</h4><div id="floors3"></div><div id="accs"></div></aside>

<div id="ctl" class="glass"><button id="b-l" title="Otočit doleva (Q)">⟲</button><button id="b-r" title="Otočit doprava (E)">⟳</button><button id="b-p" title="Přiblížit">+</button><button id="b-m" title="Oddálit">−</button><button id="b-h" title="Celé patro">⌂</button></div>

</div>

<div id="fb"><header><h1>🏢 Kancelář botů <small style="font-weight:400;color:var(--mut2)">(2D záloha, 3D se nenačetlo)</small></h1><span id="conn2">připojuji…</span></header>
<div id="banner"></div>
<main><section id="fb-floors"><p class="empty">Čekám na roster…</p></section>
<aside><h2>Živý přehled</h2><div id="fb-feed"><p class="empty">Zatím nic.</p></div></aside></main></div>
<script>
(function(){
"use strict";
var TOPIC=(function(){
  var K="kancelar_topic",OK=/^[A-Za-z0-9_-]{8,64}$/,t="";
  try{var m=/[#&]t=([^&]+)/.exec(location.hash||"");if(m){var c=decodeURIComponent(m[1]);if(OK.test(c)){t=c;try{localStorage.setItem(K,c);}catch(e){}}}}catch(e){}
  if(!t){try{var s=localStorage.getItem(K)||"";if(OK.test(s))t=s;}catch(e){}}
  if(t&&location.hash){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
  if(t){try{var mf={name:"Kancelář botů",short_name:"Kancelář",display:"standalone",background_color:"#141922",theme_color:"#141922",start_url:location.origin+location.pathname+"#t="+t,scope:location.origin+location.pathname.replace(/[^\/]*$/,""),icons:[{src:new URL("icon-192.png",location.href).href,sizes:"192x192",type:"image/png"},{src:new URL("icon-512.png",location.href).href,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
    var l=document.querySelector('link[rel=manifest]');if(l)l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));}catch(e){}}
  return t;
})();
var BASE="https://ntfy.sh/"+TOPIC;
if(!TOPIC){
  var nb=document.createElement("div");
  nb.style.cssText="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#141922;color:#eef1f6;font:16px system-ui,sans-serif;z-index:99999";

}
(function(){
  var b=document.createElement("button");b.id="forgetbtn";b.textContent="⚙";b.title="Nastavení";
  b.style.cssText="position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9000;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,25,34,.6);color:#eef1f6;font-size:16px;cursor:pointer;opacity:.55";
  var p=document.createElement("div");
  p.style.cssText="position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:9001;display:none;padding:12px 14px;border-radius:14px;background:rgba(20,25,34,.92);border:1px solid rgba(255,255,255,.18);color:#eef1f6;font:13px system-ui,sans-serif;text-align:center;max-width:280px";
  p.innerHTML='<div style="margin-bottom:8px">Na tomto zařízení zapomene soukromý kanál. Znovu ho otevřeš jen přes svůj soukromý odkaz.</div><button id="forgetgo" style="padding:7px 12px;border-radius:9px;border:0;background:#ef4444;color:#fff;font-weight:600;cursor:pointer">Zapomenout kanál</button>';
  document.body.appendChild(b);document.body.appendChild(p);
  b.onclick=function(){p.style.display=p.style.display==="none"?"block":"none";};
  p.querySelector("#forgetgo").onclick=function(){
    try{localStorage.clear();sessionStorage.clear();}catch(e){}
    var jobs=[];
    try{if(window.caches)jobs.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}));}catch(e){}
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));}catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){location.replace(location.pathname);});
  };
})();
var THREE_URL="https://unpkg.com/three@0.160.0/build/three.module.js";
var EVENTS={start:"Začal",done:"Hotovo",stuck:"Zasekl se",need:"Potřebuje tě"};

var REST_MS=2*3600*1000;

function parseMsg(m){
  if(!m||m.event!=="message"||!m.id)return null;
  var tags=m.tags||[];
  if(tags.indexOf("roster")>=0){
    try{var arr=JSON.parse(m.message);if(Array.isArray(arr))return{kind:"roster",time:m.time,id:m.id,roster:arr};}catch(e){}
    return null;
  }
  if(tags.indexOf("report-request")>=0){
    try{var q=JSON.parse(m.message);if(q&&q.bot)return{kind:"request",time:m.time,id:m.id,bot:String(q.bot),botId:q.id?String(q.id):""};}catch(e){}
    return null;
  }
  if(tags.indexOf("report")>=0){
    if(!m.title||IGNORE[m.title])return null;
    var a=m.attachment||{};
    return{kind:"report",time:m.time,id:m.id,bot:m.title,url:typeof a.url==="string"?a.url:"",name:a.name||"report.md",size:a.size||0,expires:a.expires||0};
  }
  var ev=null;for(var i=0;i<tags.length;i++){if(EVENTS[tags[i]]){ev=tags[i];break;}}
  if(!ev)return null;
  if(IGNORE[m.title])return null;
  return{kind:"event",time:m.time,id:m.id,bot:m.title||"?",ev:ev,text:m.message||""};
}
function apply(p){
  if(!p||state.seen[p.id])return false;
  state.seen[p.id]=1;
  if(p.kind==="roster"){
    if(state.rosterTime&&p.time<state.rosterTime)return false;
    state.rosterTime=p.time;state.roster={};state.rosterOrder=[];
    p.roster.forEach(function(b){if(b&&b.name){state.roster[b.name]=b;state.rosterOrder.push(b.name);}});
    return true;
  }
  if(p.kind==="request"){var r0=state.requests[p.bot];if(!r0||p.time>=r0.time)state.requests[p.bot]={time:p.time};return true;}
  if(p.kind==="report"){var o=state.reports[p.bot];if(!o||p.time>=o.time)state.reports[p.bot]={time:p.time,url:p.url,name:p.name,size:p.size,expires:p.expires};return true;}
  var c=state.counts[p.bot]||(state.counts[p.bot]={start:0,done:0,stuck:0,need:0});c[p.ev]++;
  var b=state.bots[p.bot];
  if(!b||p.time>=b.time)state.bots[p.bot]={ev:p.ev,text:p.text,time:p.time};
  state.feed.push(p);state.feed.sort(function(a,c2){return c2.time-a.time;});
  if(state.feed.length>150)state.feed.length=150;
  return true;
}
function groupFloors(){
  var floors={},order=[];
  function add(f,name){if(!floors[f]){floors[f]=[];order.push(f);}floors[f].push(name);}
  state.rosterOrder.forEach(function(n){add(state.roster[n].team||NEWFLOOR,n);});
  Object.keys(state.bots).forEach(function(n){if(!state.roster[n])add(NEWFLOOR,n);});
  order.forEach(function(f){floors[f].sort(function(a,b){return ((state.roster[b]||{}).lead?1:0)-((state.roster[a]||{}).lead?1:0);});});
  return{floors:floors,order:order};
}
function fmtTime(t){
  try{return new Date(t*1000).toLocaleString("cs-CZ",{timeZone:"Europe/Prague",day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});}
  catch(e){return String(t);}
}
function fmtHM(t){
  try{return new Date(t*1000).toLocaleTimeString("cs-CZ",{timeZone:"Europe/Prague",hour:"2-digit",minute:"2-digit",second:"2-digit"});}
  catch(e){return String(t);}
}
function statusOf(n){
  var s=state.bots[n];if(!s)return"rest";
  if(s.ev==="need")return"need";
  if(s.ev==="stuck")return ERR_RE.test(s.text)?"error":"stuck";
  if(Date.now()-s.time*1000>REST_MS)return"rest";
  return s.ev==="start"?"working":"done";
}
function waitingReport(n){var q=state.requests[n];if(!q)return false;var r=state.reports[n];return !r||r.time<q.time;}
function pendingReq(){
  // pomocná funkce pro testy: požadavky bez novějšího reportu
  return Object.keys(state.requests).filter(waitingReport);
}

function agoText(t){
  var s=Math.max(0,Math.round(Date.now()/1000-t));
  if(s<45)return"právě teď";if(s<3600)return"před "+Math.round(s/60)+" min";
  if(s<86400)return"před "+Math.floor(s/3600)+" h "+Math.round((s%3600)/60)+" min";return"před "+Math.floor(s/86400)+" d";
}
function floorStatus(names){
  var w=0,n=0,e=0;names.forEach(function(x){var s=statusOf(x);if(s==="working")w++;else if(s==="need"||s==="stuck")n++;else if(s==="error")e++;});

function publishRequest(name){
  var r=state.roster[name]||{};
  var body=JSON.stringify({bot:name,id:r.id||"",ts:Math.round(Date.now()/1000)});

  renderUI();

    if(!res.ok)throw new Error("HTTP "+res.status);
  }).catch(function(){delete state.requests[name];renderUI();setConn(false,"žádost o report se nepodařilo odeslat");});
}

/* --- jednoduchý markdown renderer (vše přes textContent) --- */
function mdInline(parent,text){
  var re=/(`[^`]+`)|(\*\*[^*]+\*\*)|(__[^_]+__)|(\*[^*\s][^*]*\*)/g,last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)parent.appendChild(document.createTextNode(text.slice(last,m.index)));
    var t=m[0],n;
    if(m[1]){n=el("code",null,t.slice(1,-1));}
    else if(m[2]||m[3]){n=el("strong",null,t.slice(2,-2));}
    else{n=el("em",null,t.slice(1,-1));}
    parent.appendChild(n);last=m.index+t.length;
  }
  if(last<text.length)parent.appendChild(document.createTextNode(text.slice(last)));
}
function mdRender(src){
  var root=document.createDocumentFragment(),lines=String(src).replace(/\r/g,"").split("\n"),i=0;
  function isTbl(l){return /^\s*\|.*\|\s*$/.test(l);}
  while(i<lines.length){
    var l=lines[i],m;
    if(/^\s*```/.test(l)){var buf=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++;}i++;var pre=el("pre");pre.appendChild(el("code",null,buf.join("\n")));root.appendChild(pre);continue;}
    if(!l.trim()){i++;continue;}
    if((m=/^(#{1,4})\s+(.*)$/.exec(l))){var h=el("h"+m[1].length);mdInline(h,m[2]);root.appendChild(h);i++;continue;}
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)){root.appendChild(el("hr"));i++;continue;}
    if(isTbl(l)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      var tb=el("table"),cells=function(s){return s.trim().replace(/^\||\|$/g,"").split("|");};
      var tr=el("tr");cells(l).forEach(function(c){var th=el("th");mdInline(th,c.trim());tr.appendChild(th);});tb.appendChild(tr);i+=2;
      while(i<lines.length&&isTbl(lines[i])){tr=el("tr");cells(lines[i]).forEach(function(c){var td=el("td");mdInline(td,c.trim());tr.appendChild(td);});tb.appendChild(tr);i++;}
      root.appendChild(tb);continue;
    }
    if(/^\s*>/.test(l)){var q=[];while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,""));i++;}var bq=el("blockquote");mdInline(bq,q.join(" "));root.appendChild(bq);continue;}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      var ord=/^\s*\d/.test(l),ul=el(ord?"ol":"ul");
      while(i<lines.length&&/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){var li=el("li");mdInline(li,lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,""));ul.appendChild(li);i++;}
      root.appendChild(ul);continue;
    }
    var par=[];while(i<lines.length&&lines[i].trim()&&!/^(\s*```|#{1,4}\s|\s*>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i])&&!isTbl(lines[i])){par.push(lines[i]);i++;}
    if(!par.length){par.push(lines[i]);i++;}
    var p=el("p");mdInline(p,par.join(" "));root.appendChild(p);
  }
  return root;
}
function showReport(name){
  var r=state.reports[name];if(!r)return;
  var body=$("mbody");body.textContent="";
  body.appendChild(el("div","mdmeta","Report: "+name+" · "+fmtTime(r.time)+" (Praha)"));
  var holder=el("div",null,"Načítám report…");body.appendChild(holder);
  $("modal").className="on";
  if(!safeUrl(r.url)){holder.textContent="Report vypršel (příloha už není dostupná).";return;}
  fetch(r.url).then(function(res){if(!res.ok)throw new Error("HTTP "+res.status);return res.text();}).then(function(t){
    holder.textContent="";holder.appendChild(mdRender(t.slice(0,300000)));
  }).catch(function(){holder.textContent="Report vypršel (příloha už není dostupná). Vyžádej nový.";});
}

      building=new THREE.Group();scene.add(building);
      var list=g.order.length?g.order:["Čekám na roster"];
      list.forEach(function(f,i){buildFloor(f,g.floors[f]||[],i,list.length);});
      // ground shadow
      var gr=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:0.16}));disposables.push(gr.geometry,gr.material);
      gr.rotation.x=-Math.PI/2;gr.position.y=-0.42;gr.receiveShadow=true;building.add(gr);
      var th=list.length*H;
      sun.position.set(-18,th/2+46,26);sun.target.position.set(0,th/2,0);
      var sc=sun.shadow.camera;sc.left=-34;sc.right=34;sc.top=34;sc.bottom=-34;sc.near=1;sc.far=150;sc.updateProjectionMatrix();
      firstBuild=false;
      layoutAfterBuild();
    }
    updateStatuses();
  }
  var pendingSnap=true;
  function layoutAfterBuild(){focus(pendingSnap);pendingSnap=false;}

  function focus(snapNow){
    var f=floorOf(sel.floor)||floorsInfo[0];if(!f)return;
    var o=sel.bot&&bots[sel.bot];
    if(o){goal.x=o.bx;goal.z=o.bz;goal.y=o.y+0.9;goal.zoom=1.7;}
    else{goal.x=0;goal.z=0;goal.y=f.y+1.0;goal.zoom=1;}
    if(snapNow)snap=true;
  }
  function rotate(dir){goal.yaw+=dir*Math.PI/2;}
  function zoomBy(k){goal.zoom=Math.max(0.5,Math.min(5,goal.zoom*k));}

  /* --- vstup --- */
  var ptrs={},down=null,pinch=0;
  function ppu(){
    var w=window.innerWidth,narrow=w<700;
    return Math.max(12,Math.min(52,(narrow?w:w-600)/(FW+2)));
  }
  canvas.addEventListener("pointerdown",function(e){
    canvas.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(ptrs);
    if(ids.length===1)down={x:e.clientX,y:e.clientY,moved:0};
    else{down=null;var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch=Math.hypot(a.x-b.x,a.y-b.y);}
  });
  function panBy(dx,dy){
    var p=ppu()*cam.zoom,sy=Math.sin(EL);
    var rx=Math.cos(goal.yaw),rz=-Math.sin(goal.yaw),fx=-Math.sin(goal.yaw),fz=-Math.cos(goal.yaw);
    var mx=-rx*dx/p+fx*dy/(p*sy),mz=-rz*dx/p+fz*dy/(p*sy);
    var lim=FW/2+6;
    goal.x=Math.max(-lim,Math.min(lim,goal.x+mx));goal.z=Math.max(-lim,Math.min(lim,goal.z+mz));
    cam.x=goal.x;cam.z=goal.z;
  }
  canvas.addEventListener("pointermove",function(e){
    var p=ptrs[e.pointerId];
    if(!p){hoverReq={x:e.clientX,y:e.clientY};return;}
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    var ids=Object.keys(ptrs);
    if(ids.length===1){if(down)down.moved+=Math.abs(dx)+Math.abs(dy);panBy(dx,dy);}
    else if(ids.length>=2){
      var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch>0){zoomBy(d/pinch);cam.zoom=goal.zoom;}pinch=d;panBy(dx/2,dy/2);
    }
  });
  function up(e){
    var had=ptrs[e.pointerId];delete ptrs[e.pointerId];
    if(Object.keys(ptrs).length<2)pinch=0;
    if(had&&down&&e.type==="pointerup"&&down.moved<6){var n=pick(e.clientX,e.clientY);if(n)selectBot(n);else if(sel.bot)deselect();}
    if(!Object.keys(ptrs).length)down=null;
  }
  canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
  canvas.addEventListener("wheel",function(e){e.preventDefault();zoomBy(Math.exp(-e.deltaY*0.0014));},{passive:false});
  var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hoverReq=null;
  function pick(cx,cy){
    var f=floorOf(sel.floor);if(!f)return null;
    var r=canvas.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    var hits=ray.intersectObjects(f.bots.map(function(b){return b.body;}),false);
    return hits.length?hits[0].object.userData.bot:null;
  }
  window.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key;
    if($("modal").className==="on"){if(k==="Escape")closeModal();return;}
    if(k==="q"||k==="Q")rotate(-1);else if(k==="e"||k==="E")rotate(1);
    else if(k==="Escape")deselect();
    else if(k==="+"||k==="=")zoomBy(1.25);else if(k==="-")zoomBy(0.8);
    else if(k==="ArrowUp"||k==="ArrowDown"){
      var g=groupFloors(),i=g.order.indexOf(sel.floor),j=i+(k==="ArrowUp"?-1:1);
      if(j>=0&&j<g.order.length){e.preventDefault();selectFloor(g.order[j]);}
    }
  });
  $("b-l").onclick=function(){rotate(-1);};$("b-r").onclick=function(){rotate(1);};
  $("b-p").onclick=function(){zoomBy(1.3);};$("b-m").onclick=function(){zoomBy(1/1.3);};
  $("b-h").onclick=function(){sel.bot=null;renderUI();focus();};

  /* --- smyčka --- */
  var clock=performance.now(),tmp=new THREE.Vector3(),W=0,Hh=0;
  function resize(){
    W=window.innerWidth;Hh=window.innerHeight;renderer.setSize(W,Hh,false);
  }
  window.addEventListener("resize",resize);resize();
  var shiftY=0;
  function frame(now){
    requestAnimationFrame(frame);
    var dt=Math.min(0.1,(now-clock)/1000);clock=now;var t=now/1000;
    var k=snap?1:1-Math.exp(-dt*6);
    cam.x+=(goal.x-cam.x)*k;cam.y+=(goal.y-cam.y)*k;cam.z+=(goal.z-cam.z)*k;cam.yaw+=(goal.yaw-cam.yaw)*k;
    cam.zoom*=Math.pow(goal.zoom/cam.zoom,k);
    snap=false;
    var narrow=W<700,p=ppu()*cam.zoom;
    var sy=0;if(narrow){var rr=$("right");sy=-(rr.offsetHeight/2);if(sel.bot)sy+=($("detail").offsetHeight/2);}
    var hw=W/2/p,hh=Hh/2/p,cy=sy/p;
    camera.left=-hw;camera.right=hw;camera.top=hh+cy;camera.bottom=-hh+cy;
    camera.updateProjectionMatrix();
    var d=100,ce=Math.cos(EL);
    camera.position.set(cam.x+Math.sin(cam.yaw)*ce*d,cam.y+Math.sin(EL)*d,cam.z+Math.cos(cam.yaw)*ce*d);
    camera.lookAt(cam.x,cam.y,cam.z);camera.updateMatrixWorld();
    // viditelnost pater
    floorsInfo.forEach(function(f){f.group.visible=f.y<=cam.y+0.2;});
    // boti
    var fcur=floorOf(sel.floor);
    Object.keys(bots).forEach(function(n){
      var o=bots[n],st=o.st||"rest",bob=0,sx=1,syy=1,jump=0;
      var spd=st==="working"?6:st==="rest"?0.9:st==="done"?2.2:1.4;
      var amp=st==="working"?0.07:st==="rest"?0.02:0.04;
      var ph=t*spd+o.ph;bob=Math.sin(ph)*amp;
      if(st==="need"||st==="stuck"||st==="error"){var c=Math.abs(Math.sin(t*(st==="need"?4.2:3.2)+o.ph));jump=c*0.5;syy=1+(0.5-c)*0.08;sx=1/Math.sqrt(syy);}
      else{syy=1+Math.sin(ph)*amp*0.5;sx=1/Math.sqrt(syy);}
      if(st==="rest"){syy*=0.93;}
      o.bodyG.position.y=bob+jump;o.bodyG.scale.set(sx,syy,sx);
      var spawn=1;if(o.born>0){var a=Math.min(1,(t-o.born)/0.7);spawn=1+1.70158*Math.pow(a-1,3)+1.70158*Math.pow(a-1,2);if(a<=0)spawn=0.001;if(a>=1)o.born=-1;}
      o.g.scale.setScalar(Math.max(0.001,spawn));
      o.g.rotation.y=cam.yaw;
      // mrkání
      var closed=st==="rest";
      if(t>o.blinkAt){o.blinkEnd=t+0.14;o.blinkAt=t+2+Math.random()*4.5;}
      if(t<o.blinkEnd)closed=true;
      var es=closed?0.1:1;o.eL.scale.y+=(es-o.eL.scale.y)*0.5;o.eR.scale.y=o.eL.scale.y;
      // ztlumení
      var dt2=st==="rest"?1:0;o.dim+=(dt2-o.dim)*0.08;
      o.bodyMat.color.copy(o.base).lerp(GRAY,o.dim*0.55);
      // kruh
      var pulse=(st==="need"||o.name===sel.bot)?1+0.12*Math.sin(t*5):1;o.ring.scale.set(pulse,1,pulse);
      o.badge.position.y=1.75+bob+jump;o.badge.visible=(o.floor===fcur);
      var op=1;o.badge.material.opacity=op;
    });
    renderer.render(scene,camera);
    // bubliny
    var maxW=Math.max(84,Math.min(170,p*3.7));
    Object.keys(bots).forEach(function(n){
      var o=bots[n],vis=fcur&&o.floor===fcur&&o.floor.group.visible&&Math.abs(cam.y-o.floor.y-1)<4;
      if(!vis){if(o.bub.style.display!=="none")o.bub.style.display="none";return;}
      tmp.set(o.bx,o.y+1.9*o.g.scale.x+o.bodyG.position.y,o.bz).project(camera);
      var px=(tmp.x*0.5+0.5)*W,py=(-tmp.y*0.5+0.5)*Hh;
      var s=o.bub.style;s.display="block";s.maxWidth=(sel.bot===n?230:maxW)+"px";
      s.transform="translate("+Math.round(px)+"px,"+Math.round(py-8)+"px) translate(-50%,-100%)";
      s.left="0";s.top="0";s.zIndex=sel.bot===n?"9":String(Math.round(py)>>3);
    });
    if(hoverReq){canvas.style.cursor=pick(hoverReq.x,hoverReq.y)?"pointer":"grab";hoverReq=null;}
  }
  requestAnimationFrame(frame);
  $("loading").style.display="none";
  scene3d={sync:sync,focus:function(){focus();}};
  window.__office={THREE:THREE,renderer:renderer,state:state};
  setFallback(false);
  renderUI();
  setInterval(function(){renderUI();},30000);
}

/* ================= start ================= */
$("mclose").onclick=closeModal;$("modal").onclick=function(e){if(e.target===$("modal"))closeModal();};
var webglOk=(function(){try{var c=document.createElement("canvas");return !!(c.getContext("webgl2")||c.getContext("webgl"));}catch(e){return false;}})();
var fbTimer=setTimeout(function(){if(!scene3d)setFallback(true);},12000);
if(!webglOk){clearTimeout(fbTimer);setFallback(true);}
else{
  import(THREE_URL).then(function(mod){clearTimeout(fbTimer);init3D(mod);}).catch(function(){setFallback(true);});
}
renderUI();
backfill().then(live);
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
